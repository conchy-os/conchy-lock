[package]
name = "conchy-lock"
version = "0.1.0"
edition = "2021"
description = "Beautiful, minimal ext-session-lock screen locker for Conchy OS"
license = "GPL-3.0-or-later"

[[bin]]
name = "conchy-lock"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cosmic-text = "0.14"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kdl = "4.6"
pam = "0.8"
smithay-client-toolkit = "0.20"
tiny-skia = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-client = "0.31"
zeroize = "1"

[profile.dev]
opt-level = 2

[profile.release]
lto = "thin"
